serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial
set timeout=3
set default=0

menuentry 'NekoOS (persistent virtual disk)' {
    echo 'NEKO_BOOTLOADER_READY'
    linux /boot/bzImage console=ttyS0,115200 rdinit=/init panic=-1 neko.state=required neko.boot=iso
    initrd /boot/initramfs.cpio.gz
}
